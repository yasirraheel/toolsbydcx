<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolsByDcx - All Sessions Cleared</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.15), transparent);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      color: #f8fafc;
    }
    .card {
      width: 100%;
      maxWidth: 480px;
      background: #0e1320;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 44px 36px 36px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(16, 185, 129, 0.08);
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
    }
    .logo-badge img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .brand-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #10b981;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .check-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
    }
    .heading {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 14px 0;
      letter-spacing: -0.5px;
    }
    .description {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 12px 0;
      max-width: 380px;
    }
    .subtext {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 32px 0;
      max-width: 360px;
    }
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }
    .btn-secondary {
      width: 100%;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      background: #161d2d;
      border: 1px solid #334155;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }
    .footer {
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/logo.png" alt="ToolsByDcx">
    </div>
    <div class="brand-title">TOOLSBYDCX</div>
    <div class="check-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1 class="heading">All Sessions Cleared</h1>
    <p class="description">Google Flow, Whisk, and all injected sessions have been signed out.</p>
    <p class="subtext">Your ToolsByDcx account is safe. You can log back in anytime.</p>
    <div class="button-group">
      <a href="/" class="btn-primary">Return to ToolsByDcx</a>
      <button onclick="window.close()" class="btn-secondary">Close Tab</button>
    </div>
    <div class="footer">Thank you for using ToolsByDcx</div>
  </div>
</body>
</html>
